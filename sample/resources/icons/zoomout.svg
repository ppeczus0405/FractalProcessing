<!-- zoomout.svg -->
<svg
    width="24"
    height="24"
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg">

  <!-- Outer circle for magnifying glass -->
  <circle
    cx="10"
    cy="10"
    r="6"
    stroke="currentColor"
    fill="none"
    stroke-width="2" />

  <!-- Minus sign inside the circle -->
  <line
    x1="7"
    y1="10"
    x2="13"
    y2="10"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round" />

  <!-- Handle of the magnifying glass -->
  <line
    x1="14.5"
    y1="14.5"
    x2="20"
    y2="20"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round" />
</svg>
